name: Bond402 Launch Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: bond402_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bond402_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/bond402_ci
      NODE_ENV: test
      CI: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.26.1 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare isolated test schema
        run: pnpm --filter @workspace/db run push

      - name: Run free dependency audit
        run: pnpm audit --audit-level high

      - name: Run local launch gate
        run: pnpm run test:launch-gate