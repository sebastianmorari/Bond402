openapi: 3.1.0
info:
  title: Bond402 API
  version: 0.2.0
  description: |
    Öffentliche Bond402-API zur Prüfung eigener API-Dienste.
    Die Browser-Anwendung verwendet /api über den Vercel-Proxy.
    Für direkte Server-zu-Server-Aufrufe steht die Render-Produktionsbasis ebenfalls zur Verfügung.
servers:
  - url: /api
    description: Öffentliche Basis über die Bond402-Webanwendung (empfohlen)
  - url: https://bond402-api.onrender.com/api
    description: Direkte Produktionsbasis des Bond402-API-Servers
tags:
  - name: health
  - name: auth
  - name: services
  - name: dashboard
  - name: usage
  - name: developer
  - name: api-keys
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Liveness check
      description: Confirms that the Bond402 API process is running. It does not check external dependencies.
      responses:
        "200":
          description: API process is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Readiness check
      description: Confirms that the API process can reach its PostgreSQL database.
      responses:
        "200":
          description: API is ready to serve requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: API process is running but its database is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Read the current local session user
      security:
        - Bond402Session: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/register:
    post:
      operationId: registerAuthUser
      tags: [auth]
      summary: Register a local Bond402 account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegisterBody"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid registration data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/login:
    post:
      operationId: loginAuthUser
      tags: [auth]
      summary: Sign in to a local Bond402 account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginBody"
      responses:
        "200":
          description: Signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/logout:
    post:
      operationId: logoutAuthUser
      tags: [auth]
      summary: End the current local session
      security:
        - Bond402Session: []
      responses:
        "204":
          description: Signed out
  /auth/password:
    put:
      operationId: changeAuthPassword
      tags: [auth]
      summary: Change the password for the current local session
      security:
        - Bond402Session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthChangePasswordBody"
      responses:
        "204":
          description: Password changed and all previous sessions revoked
        "400":
          description: Invalid password data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not signed in or current password is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many password change attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List all registered API services with their checks
      security:
        - Bond402Session: []
      responses:
        "200":
          description: Registered services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiService"
    post:
      operationId: createService
      tags: [services]
      summary: Register an API service
      security:
        - Bond402Session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiServiceInput"
      responses:
        "201":
          description: Created service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiService"
        "400":
          description: Invalid service data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /services/{id}:
    get:
      operationId: getService
      tags: [services]
      summary: Get one service and its check history
      security:
        - Bond402Session: []
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200":
          description: Service details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiService"
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteService
      tags: [services]
      summary: Delete a registered service and its checks
      security:
        - Bond402Session: []
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "204":
          description: Deleted
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateService
      tags: [services]
      summary: Update a registered service owned by the current user
      security:
        - Bond402Session: []
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiServiceUpdate"
      responses:
        "200":
          description: Updated service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiService"
        "400":
          description: Invalid update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /services/{id}/checks:
    post:
      operationId: runServiceCheck
      tags: [services]
      summary: Run a safe external verification
      security:
        - Bond402Session: []
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "201":
          description: Completed check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResult"
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /services/{id}/verify:
    post:
      operationId: verifyServiceResponse
      tags: [services]
      summary: Compare a supplied response with the expected structure
      security:
        - Bond402Session: []
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationInput"
      responses:
        "201":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResult"
        "400":
          description: Invalid actual response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get Bond402 dashboard metrics
      security:
        - Bond402Session: []
      responses:
        "200":
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardMetrics"
  /usage:
    get:
      operationId: getUsage
      tags: [usage]
      summary: Read the current monthly check quota
      security:
        - Bond402Session: []
      responses:
        "200":
          description: Current plan and monthly usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageSummary"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api-keys:
    get:
      operationId: listApiKeys
      tags: [api-keys]
      summary: List API key metadata for the signed-in user
      security:
        - Bond402Session: []
      responses:
        "200":
          description: API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
    post:
      operationId: createApiKey
      tags: [api-keys]
      summary: Create an API key and reveal its secret once
      security:
        - Bond402Session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyInput"
      responses:
        "201":
          description: Created API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiKey"
        "400":
          description: Invalid name or key limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many key-management requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api-keys/{id}:
    delete:
      operationId: revokeApiKey
      tags: [api-keys]
      summary: Revoke an API key owned by the signed-in user
      security:
        - Bond402Session: []
      parameters:
        - $ref: "#/components/parameters/ApiKeyId"
      responses:
        "204":
          description: Revoked
        "404":
          description: API key not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many key-management requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /developer/services/{id}:
    get:
      operationId: developerGetService
      tags: [developer]
      summary: Read one owned service using a Bond402 API key
      security:
        - Bond402ApiKey: []
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200":
          description: Owned service with trust score and recent check history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeveloperServiceResult"
        "401":
          description: Missing, invalid, or revoked API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /developer/services/{id}/checks:
    post:
      operationId: developerRunServiceCheck
      tags: [developer]
      summary: Run a live check for one owned service using a Bond402 API key
      security:
        - Bond402ApiKey: []
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "201":
          description: Completed check with updated trust score and recent history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeveloperServiceResult"
        "401":
          description: Missing, invalid, or revoked API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /developer/services/{id}/checks/latest:
    get:
      operationId: developerGetLatestCheck
      tags: [developer]
      summary: Read the latest check and trust score for one owned service
      security:
        - Bond402ApiKey: []
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200":
          description: Latest check, trust score, and recent history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeveloperServiceResult"
        "401":
          description: Missing, invalid, or revoked API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Service or check not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /developer/services/{id}/pre-action-check:
    post:
      operationId: developerPreActionCheck
      tags: [developer]
      summary: Decide whether an AI agent should use an owned service
      description: |
        Returns ALLOW, CAUTION, or BLOCK using the latest reachability,
        latency, structure, PASS/FAIL history, Trust Score, freshness, and
        detected anomalies. One product check is consumed from the monthly quota.
      security:
        - Bond402ApiKey: []
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200":
          description: Machine-readable pre-action decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeveloperPreActionCheck"
        "401":
          description: Missing, invalid, or revoked API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limit or monthly quota exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /demo-services:
    get:
      operationId: listDemoServices
      tags: [services]
      summary: List safe public demo endpoints
      responses:
        "200":
          description: Demo service templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DemoService"
components:
  securitySchemes:
    Bond402ApiKey:
      type: http
      scheme: bearer
      bearerFormat: Bond402 API key
      description: "API-Schlüssel aus dem Developer-Bereich. Nur als Authorization: Bearer b402_… senden und niemals in URLs, Logs oder Frontend-Code eintragen."
    Bond402Session:
      type: apiKey
      in: cookie
      name: bond402_session
      description: HttpOnly-Session-Cookie der lokalen Web-Anmeldung. Nicht für die Developer-API verwenden.
  parameters:
    ServiceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ApiKeyId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ReadinessStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok, unavailable]
      required: [status]
    AuthRegisterBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        email:
          type: string
          maxLength: 320
          pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
        password:
          type: string
          minLength: 8
          maxLength: 128
      required: [name, email, password]
    AuthLoginBody:
      type: object
      properties:
        email:
          type: string
          maxLength: 320
          pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
        password:
          type: string
          minLength: 8
          maxLength: 128
      required: [email, password]
    AuthChangePasswordBody:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 8
          maxLength: 128
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
      required: [currentPassword, newPassword]
    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
        name:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, email, name, createdAt]
    AuthSession:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
      required: [user]
    ApiError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        quota:
          anyOf:
            - $ref: "#/components/schemas/UsageSummary"
            - type: "null"
      required: [error, code]
    ApiKeyInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
      required: [name]
    ApiKey:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: ["string", "null"]
          format: date-time
        revokedAt:
          type: ["string", "null"]
          format: date-time
      required: [id, name, prefix, createdAt, lastUsedAt, revokedAt]
    CreatedApiKey:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          properties:
            secret:
              type: string
          required: [secret]
    DeveloperService:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
        expectedStructure:
          type: string
        maxResponseTime:
          type: number
      required: [id, name, url, expectedStructure, maxResponseTime]
    DeveloperServiceResult:
      type: object
      properties:
        service:
          $ref: "#/components/schemas/DeveloperService"
        trustScore:
          type: ["number", "null"]
        trustExplanation:
          type: string
        latestCheck:
          anyOf:
            - $ref: "#/components/schemas/CheckResult"
            - type: "null"
        checks:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/CheckResult"
      required: [service, trustScore, trustExplanation, latestCheck, checks]
    ApiServiceInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        url:
          type: string
          maxLength: 2048
          pattern: "^https?://"
        expectedStructure:
          type: string
          minLength: 1
          maxLength: 4000
        maxResponseTime:
          type: number
          minimum: 100
          maximum: 15000
      required: [name, url, expectedStructure, maxResponseTime]
    ApiServiceUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        url:
          type: string
          maxLength: 2048
          pattern: "^https?://"
        expectedStructure:
          type: string
          minLength: 1
          maxLength: 4000
        maxResponseTime:
          type: number
          minimum: 100
          maximum: 15000
    ApiService:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
        expectedStructure:
          type: string
        maxResponseTime:
          type: number
        createdAt:
          type: string
          format: date-time
        trustScore:
          type: ["number", "null"]
        trustExplanation:
          type: string
        checks:
          type: array
          items:
            $ref: "#/components/schemas/CheckResult"
      required: [id, name, url, expectedStructure, maxResponseTime, createdAt, trustScore, trustExplanation, checks]
    CheckResult:
      type: object
      properties:
        id:
          type: string
        serviceId:
          type: string
        checkedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [PASS, FAIL, REVIEW]
        checkType:
          type: string
          enum: [LIVE, MANUAL]
        reachable:
          type: boolean
        responseTimeMs:
          type: number
        structureMatch:
          type: boolean
        httpStatus:
          type: ["number", "null"]
        errorCode:
          type: ["string", "null"]
        summary:
          type: string
        foundFields:
          type: array
          items:
            type: string
        missingFields:
          type: array
          items:
            type: string
      required: [id, serviceId, checkedAt, status, checkType, reachable, responseTimeMs, structureMatch, httpStatus, errorCode, summary, foundFields, missingFields]
    VerificationInput:
      type: object
      properties:
        actualResponse:
          type: string
          minLength: 1
          maxLength: 100000
      required: [actualResponse]
    DashboardMetrics:
      type: object
      properties:
        serviceCount:
          type: number
        checkCount:
          type: number
        passRate:
          type: number
        averageResponseTimeMs:
          type: number
      required: [serviceCount, checkCount, passRate, averageResponseTimeMs]
    UsageSummary:
      type: object
      properties:
        plan:
          type: string
          enum: [FREE, STARTER, PRO, BUSINESS, ENTERPRISE]
        planName:
          type: string
        monthlyLimit:
          type: ["number", "null"]
        usedChecks:
          type: number
        remainingChecks:
          type: ["number", "null"]
        periodStart:
          type: string
          format: date-time
        resetAt:
          type: string
          format: date-time
        upgradeAvailable:
          type: boolean
        priceChf:
          type: ["number", "null"]
        description:
          type: string
        availablePlans:
          type: array
          items:
            $ref: "#/components/schemas/PlanOption"
      required: [plan, planName, monthlyLimit, usedChecks, remainingChecks, periodStart, resetAt, upgradeAvailable, priceChf, description, availablePlans]
    PlanOption:
      type: object
      properties:
        plan:
          type: string
          enum: [FREE, STARTER, PRO, BUSINESS, ENTERPRISE]
        planName:
          type: string
        monthlyLimit:
          type: ["number", "null"]
        priceChf:
          type: ["number", "null"]
        description:
          type: string
      required: [plan, planName, monthlyLimit, priceChf, description]
    DeveloperPreActionFactors:
      type: object
      properties:
        trustScore:
          type: ["number", "null"]
        latestStatus:
          type: ["string", "null"]
          enum: [PASS, FAIL, REVIEW, null]
        latestCheckAt:
          type: ["string", "null"]
          format: date-time
        latestResponseTimeMs:
          type: ["number", "null"]
        latestReachable:
          type: ["boolean", "null"]
        latestStructureMatch:
          type: ["boolean", "null"]
        recentLiveChecks:
          type: number
        recentPasses:
          type: number
        recentFailures:
          type: number
        anomalies:
          type: array
          items:
            type: string
      required: [trustScore, latestStatus, latestCheckAt, latestResponseTimeMs, latestReachable, latestStructureMatch, recentLiveChecks, recentPasses, recentFailures, anomalies]
    DeveloperPreActionCheck:
      type: object
      properties:
        serviceId:
          type: string
        serviceName:
          type: string
        decision:
          type: string
          enum: [ALLOW, CAUTION, BLOCK]
        reasons:
          type: array
          items:
            type: string
        factors:
          $ref: "#/components/schemas/DeveloperPreActionFactors"
        evaluatedAt:
          type: string
          format: date-time
      required: [serviceId, serviceName, decision, reasons, factors, evaluatedAt]
    DemoService:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
        expectedStructure:
          type: string
        maxResponseTime:
          type: number
        explanation:
          type: string
      required: [name, url, expectedStructure, maxResponseTime, explanation]