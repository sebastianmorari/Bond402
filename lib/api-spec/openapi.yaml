openapi: 3.1.0
info:
  title: Bond402 API
  version: 0.2.0
  description: |
    Öffentliche Bond402-API zur Prüfung eigener API-Dienste.
    Die Browser-Anwendung verwendet /api über den Vercel-Proxy.
    Für direkte Server-zu-Server-Aufrufe steht die Render-Produktionsbasis ebenfalls zur Verfügung.
servers:
  - url: /api
    description: Öffentliche Basis über die Bond402-Webanwendung (empfohlen)
  - url: https://bond402.com/api
    description: Öffentliche Produktionsbasis für Agenten und Integrationen
  - url: https://bond402-api.onrender.com/api
    description: Direkte Produktionsbasis des Bond402-API-Servers
tags:
  - name: health
  - name: auth
  - name: services
  - name: dashboard
  - name: usage
  - name: developer
  - name: api-keys
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Liveness check
      description: Confirms that the Bond402 API process is running. It does not check external dependencies.
      responses:
        "200":
          description: API process is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Readiness check
      description: Confirms that the API process can reach its PostgreSQL database.
      responses:
        "200":
          description: API is ready to serve requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: API process is running but its database is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Read the current local session user
      security:
        - Bond402Session: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/register:
    post:
      operationId: registerAuthUser
      tags: [auth]
      summary: Register a local Bond402 account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegisterBody"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRegistrationResponse"
        "400":
          description: Invalid registration data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/login:
    post:
      operationId: loginAuthUser
      tags: [auth]
      summary: Sign in to a local Bond402 account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginBody"
      responses:
        "200":
          description: Signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/logout:
    post:
      operationId: logoutAuthUser
      tags: [auth]
      summary: End the current local session
      security:
        - Bond402Session: []
      responses:
        "204":
          description: Signed out
  /auth/password:
    put:
      operationId: changeAuthPassword
      tags: [auth]
      summary: Change the password for the current local session
      security:
        - Bond402Session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthChangePasswordBody"
      responses:
        "204":
          description: Password changed and all previous sessions revoked
        "400":
          description: Invalid password data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/verify-email:
    post:
      operationId: verifyAuthEmail
      tags: [auth]
      summary: Verify an email address with a one-time token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthVerifyEmailBody"
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
        "400":
          description: Token is invalid, expired, or already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/resend-verification:
    post:
      operationId: resendAuthVerification
      tags: [auth]
      summary: Send an email verification link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthEmailBody"
      responses:
        "202":
          description: Generic response that does not reveal account existence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
        "429":
          description: Too many verification requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/password/forgot:
    post:
      operationId: requestAuthPasswordReset
      tags: [auth]
      summary: Request a password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthEmailBody"
      responses:
        "202":
          description: Generic response that does not reveal account existence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
        "429":
          description: Too many password reset requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/password/reset:
    post:
      operationId: resetAuthPassword
      tags: [auth]
      summary: Set a new password with a one-time reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthResetPasswordBody"
      responses:
        "204":
          description: Password changed and all sessions revoked
        "400":
          description: Token is invalid, expired, or already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not signed in or current password is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many password change attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List all registered API services with their checks
      security:
        - Bond402Session: []
      responses:
        "200":
          description: Registered services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiService"
        "401":
          description: Not signed in
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Database temporarily unavailable
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createService
      tags: [services]
      summary: Register an API service
      security:
        - Bond402Session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiServiceInput"
      responses:
        "201":
          description: Created service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiService"
        "400":
          description: Invalid service data
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Not signed in
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Service already exists
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Database temporarily unavailable
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /services/{id}:
    get:
      operationId: getService
      tags: [services]
      summary: Get one service and its check history
      security:
        - Bond402Session: []
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200":
          description: Service details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiService"
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteService
      tags: [services]
      summary: Delete a registered service and its checks
      security:
        - Bond402Session: []
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "204":
          description: Deleted
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateService
      tags: [services]
      summary: Update a registered service owned by the current user
      security:
        - Bond402Session: []
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiServiceUpdate"
      responses:
        "200":
          description: Updated service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiService"
        "400":
          description: Invalid update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /services/{id}/checks:
    post:
      operationId: runServiceCheck
      tags: [services]
      summary: Run a safe external verification
      security:
        - Bond402Session: []
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "201":
          description: Completed check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResult"
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /services/{id}/verify:
    post:
      operationId: verifyServiceResponse
      tags: [services]
      summary: Compare a supplied response with the expected structure
      security:
        - Bond402Session: []
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationInput"
      responses:
        "201":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResult"
        "400":
          description: Invalid actual response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /services/{id}/domain-verification:
    post:
      operationId: issueDomainVerification
      tags: [services]
      summary: Issue a one-time domain verification token
      security:
        - Bond402Session: []
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200":
          description: Verification instructions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainVerificationIssue"
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /services/{id}/domain-verification/check:
    post:
      operationId: checkDomainVerification
      tags: [services]
      summary: Check the HTTPS well-known domain verification file
      security:
        - Bond402Session: []
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200":
          description: Domain verification status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainVerificationResult"
        "400":
          description: Verification has not been started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get Bond402 dashboard metrics
      security:
        - Bond402Session: []
      responses:
        "200":
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardMetrics"
  /usage:
    get:
      operationId: getUsage
      tags: [usage]
      summary: Read the current monthly check quota
      security:
        - Bond402Session: []
      responses:
        "200":
          description: Current plan and monthly usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageSummary"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api-keys:
    get:
      operationId: listApiKeys
      tags: [api-keys]
      summary: List API key metadata for the signed-in user
      security:
        - Bond402Session: []
      responses:
        "200":
          description: API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
    post:
      operationId: createApiKey
      tags: [api-keys]
      summary: Create an API key and reveal its secret once
      security:
        - Bond402Session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyInput"
      responses:
        "201":
          description: Created API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiKey"
        "400":
          description: Invalid name or key limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many key-management requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api-keys/{id}:
    delete:
      operationId: revokeApiKey
      tags: [api-keys]
      summary: Revoke an API key owned by the signed-in user
      security:
        - Bond402Session: []
      parameters:
        - $ref: "#/components/parameters/ApiKeyId"
      responses:
        "204":
          description: Revoked
        "404":
          description: API key not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many key-management requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /developer/services/{id}:
    get:
      operationId: developerGetService
      tags: [developer]
      summary: Read one owned service using a Bond402 API key
      security:
        - Bond402ApiKey: []
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200":
          description: Owned service with trust score and recent check history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeveloperServiceResult"
        "401":
          description: Missing, invalid, or revoked API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /developer/services/{id}/checks:
    post:
      operationId: developerRunServiceCheck
      tags: [developer]
      summary: Run a live check for one owned service using a Bond402 API key
      security:
        - Bond402ApiKey: []
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "201":
          description: Completed check with updated trust score and recent history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeveloperServiceResult"
        "401":
          description: Missing, invalid, or revoked API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /developer/services/{id}/checks/latest:
    get:
      operationId: developerGetLatestCheck
      tags: [developer]
      summary: Read the latest check and trust score for one owned service
      security:
        - Bond402ApiKey: []
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200":
          description: Latest check, trust score, and recent history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeveloperServiceResult"
        "401":
          description: Missing, invalid, or revoked API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Service or check not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /developer/services/{id}/pre-action-check:
    post:
      operationId: developerPreActionCheck
      tags: [developer]
      summary: Decide whether an AI agent should use an owned service
      description: |
        Returns ALLOW, CAUTION, or BLOCK using the latest reachability,
        latency, structure, PASS/FAIL history, Trust Score, freshness, and
        detected anomalies. One product check is consumed from the monthly quota.
      security:
        - Bond402ApiKey: []
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200":
          description: Machine-readable pre-action decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeveloperPreActionCheck"
        "401":
          description: Missing, invalid, or revoked API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limit or monthly quota exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /public/discovery:
    get:
      operationId: getPublicDiscovery
      tags: [developer]
      summary: Discover public Bond402 agent endpoints
      responses:
        "200":
          description: Public discovery metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicDiscovery"
        "429":
          description: Public discovery rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /public/services:
    get:
      operationId: searchPublicServices
      tags: [developer]
      summary: Search the public catalog of operator-listed services
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Public catalog page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicServiceCatalog"
        "400":
          description: Invalid search or pagination input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Public catalog rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /public/services/{id}:
    get:
      operationId: getPublicService
      tags: [developer]
      summary: Read public trust metadata for one listed service
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200":
          description: Public service metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicService"
        "404":
          description: Service is private, unlisted, deleted, or unknown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Public catalog rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /public/services/{id}/pre-action-check:
    get:
      operationId: getPublicPreActionCheck
      tags: [developer]
      summary: Get a read-only decision for a listed service before an action
      description: |
        Returns ALLOW, CAUTION, or BLOCK from stored checks for an operator-listed
        service. This public read-only result does not run a live check and does not
        consume the owner's monthly product quota. Live checks and owner actions still
        require a Developer API key.
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200":
          description: Public pre-action decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPreActionCheck"
        "400":
          description: Invalid action context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Service is private, unlisted, deleted, or unknown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Public catalog rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: postPublicPreActionCheck
      tags: [developer]
      summary: Get a public pre-action decision with explicit action context
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicPreActionBody"
      responses:
        "200":
          description: Public pre-action decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPreActionCheck"
        "400":
          description: Invalid action context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Service is private, unlisted, deleted, or unknown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Public catalog rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /openapi.json:
    get:
      operationId: getPublicOpenApi
      tags: [developer]
      summary: Download the public Bond402 OpenAPI document
      responses:
        "200":
          description: OpenAPI 3.1 JSON document
        "429":
          description: Public catalog rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /demo-services:
    get:
      operationId: listDemoServices
      tags: [services]
      summary: List safe public demo endpoints
      responses:
        "200":
          description: Demo service templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DemoService"
components:
  securitySchemes:
    Bond402ApiKey:
      type: http
      scheme: bearer
      bearerFormat: Bond402 API key
      description: "API-Schlüssel aus dem Developer-Bereich. Nur als Authorization: Bearer b402_… senden und niemals in URLs, Logs oder Frontend-Code eintragen."
    Bond402Session:
      type: apiKey
      in: cookie
